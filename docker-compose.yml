services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vocalpay
      POSTGRES_PASSWORD: vocalpay
      POSTGRES_DB: vocalpay
    ports:
      - "5433:5432"
    volumes:
      - vocalpay_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vocalpay -d vocalpay"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  vocalpay_pg:
