# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys VocalPay as a single free web service: FastAPI serves both the API
# and the static frontend (see the StaticFiles mount at the bottom of
# main.py), so there's exactly one URL for the whole demo.
#
# Storage: when TURSO_DATABASE_URL is set, db.py routes all queries to a
# Turso (libSQL) database instead of the local SQLite file — see db.py's
# _LibsqlConn wrapper. That's what makes data (contacts, payment methods,
# transactions) survive redeploys and the free plan's cold starts, instead of
# resetting with the container's ephemeral disk every time. If
# TURSO_DATABASE_URL is left unset, it falls back to the local SQLite file
# exactly as before (fine for local dev, but back to resetting on every
# restart in production).
#
# Known limitation of this free deployment target: the support chatbot runs
# ONLY on a self-hosted Ollama model (support_chat.py) -- no cloud LLM API is
# used anywhere in this app. faster-whisper (local voice transcription,
# voice_service.py) and Ollama both need real CPU/RAM/GPU this free instance
# doesn't have, so OLLAMA_BASE_URL must point at a real server you run
# elsewhere for /support/chat to work here; without it, that endpoint
# returns a clear connection error rather than crashing the app. Payments
# (PayID, BPAY, PIN/passkey confirmation) are unaffected either way.
services:
  - type: web
    name: vocalpay
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STRIPE_SECRET_KEY
        sync: false # set this manually in the Render dashboard — never committed to git
      - key: TURSO_DATABASE_URL
        sync: false # e.g. libsql://vocalpay-<your-org>.turso.io — from `turso db show vocalpay --url`
      - key: TURSO_AUTH_TOKEN
        sync: false # from `turso db tokens create vocalpay`
      - key: OLLAMA_BASE_URL
        sync: false # required for /support/chat to work — your self-hosted Ollama server's URL
      - key: OLLAMA_MODEL
        value: qwen2.5:7b-instruct
      - key: WEBAUTHN_RP_ID
        value: vocalpay.onrender.com # must exactly match the serving domain, no scheme/port
      - key: WEBAUTHN_RP_NAME
        value: VocalPay
      - key: WEBAUTHN_ORIGIN
        value: https://vocalpay.onrender.com # exact scheme+host the browser sends, no trailing slash
