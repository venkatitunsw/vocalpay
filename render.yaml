# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Deploys VocalPay as a single free web service: FastAPI serves both the API
# and the static frontend (see the StaticFiles mount at the bottom of
# main.py), so there's exactly one URL for the whole demo.
#
# Storage: DATABASE_URL points at a Neon Postgres database, so contacts,
# payment methods, transactions and chat memory survive redeploys and the free
# plan's cold starts. Voice runs in the browser (Whisper), so the server needs
# no speech model.
#
# The support chatbot runs ONLY on a self-hosted Ollama model (llama3.1:8b) --
# no cloud LLM API is used anywhere in this app. Ollama needs real CPU/RAM/GPU
# this free instance doesn't have, so OLLAMA_BASE_URL must point at a server
# you run elsewhere; without it /support/chat returns a clear connection error.
# Payments (PayID, BPAY, service providers, PIN/passkey) are unaffected.
services:
  - type: web
    name: vocalpay
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STRIPE_SECRET_KEY
        sync: false # set this manually in the Render dashboard — never committed to git
      - key: DATABASE_URL
        sync: false # Neon connection string, e.g. postgresql://user:pass@ep-xxx.neon.tech/vocalpay?sslmode=require
      - key: OLLAMA_BASE_URL
        sync: false # required for /support/chat to work — your self-hosted Ollama server's URL
      - key: OLLAMA_MODEL
        value: llama3.1:8b
      - key: WEBAUTHN_RP_ID
        value: vocalpay.onrender.com # must exactly match the serving domain, no scheme/port
      - key: WEBAUTHN_RP_NAME
        value: VocalPay
      - key: WEBAUTHN_ORIGIN
        value: https://vocalpay.onrender.com # exact scheme+host the browser sends, no trailing slash
