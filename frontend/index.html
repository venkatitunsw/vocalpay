<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VocalPay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="h-screen bg-slate-950 text-slate-100 overflow-hidden">
  <div class="flex h-full">

    <!-- Main chat column -->
    <div class="flex flex-col flex-1 min-w-0">

      <!-- Header -->
      <header class="flex items-center justify-between px-5 py-3 border-b border-slate-800 bg-slate-900/60 backdrop-blur">
        <div class="flex items-center gap-2">
          <div class="h-8 w-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-slate-950">V</div>
          <div>
            <h1 class="text-sm font-semibold leading-none">VocalPay</h1>
            <p class="text-[11px] text-slate-500 leading-none mt-1">voice-ready payment assistant</p>
          </div>
        </div>
        <div class="flex items-center gap-3">
          <span id="session-badge" class="text-[11px] font-mono text-slate-500 bg-slate-800 px-2 py-1 rounded-md">
            connecting…
          </span>
          <button id="setup-toggle"
            class="text-xs font-medium px-3 py-1.5 rounded-md border border-slate-700 hover:bg-slate-800 transition">
            Setup
          </button>
          <button id="audit-toggle"
            class="text-xs font-medium px-3 py-1.5 rounded-md border border-slate-700 hover:bg-slate-800 transition">
            Audit Log
          </button>
        </div>
      </header>

      <!-- Message feed -->
      <main id="feed" class="flex-1 overflow-y-auto px-4 py-6 space-y-4 max-w-2xl w-full mx-auto"></main>

      <!-- Composer -->
      <footer class="border-t border-slate-800 bg-slate-900/60 backdrop-blur px-4 py-3">
        <form id="composer" class="max-w-2xl w-full mx-auto flex items-end gap-2">
          <button type="button" id="mic-btn"
            class="shrink-0 h-11 w-11 rounded-full flex items-center justify-center border border-slate-700 text-slate-300 hover:bg-slate-800 transition relative"
            title="Voice input">
            <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5">
              <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/>
              <path d="M19 11a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 11Z"/>
            </svg>
            <span id="mic-pulse" class="hidden absolute inset-0 rounded-full bg-rose-500/40 animate-ping"></span>
          </button>

          <div class="flex-1 relative">
            <textarea id="text-input" rows="1" placeholder='Try: "Pay 12 to John for dinner"'
              class="w-full resize-none bg-slate-800 rounded-2xl px-4 py-3 pr-4 text-sm outline-none focus:ring-2 focus:ring-emerald-500 placeholder:text-slate-500"></textarea>
          </div>

          <button type="submit"
            class="shrink-0 h-11 w-11 rounded-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 flex items-center justify-center transition disabled:opacity-40"
            id="send-btn">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="h-5 w-5 -mr-0.5">
              <path d="M3.4 20.6 21 12 3.4 3.4 3 10l13 2-13 2z"/>
            </svg>
          </button>
        </form>
        <p id="mic-status" class="max-w-2xl w-full mx-auto text-[11px] text-slate-500 mt-1.5 h-4"></p>
      </footer>
    </div>

    <!-- Side panel: Setup / Audit Log (tabbed, one drawer) -->
    <aside id="side-panel"
      class="w-96 shrink-0 border-l border-slate-800 bg-slate-900/80 backdrop-blur flex flex-col -mr-96 transition-[margin] duration-300">

      <!-- Setup tab -->
      <div id="panel-setup" class="flex-1 overflow-y-auto flex flex-col">
        <div class="px-4 py-3 border-b border-slate-800">
          <h2 class="text-sm font-semibold">Setup</h2>
          <p class="text-[11px] text-slate-500">demo-user's contacts &amp; payment methods</p>
        </div>

        <div class="px-4 py-3 border-b border-slate-800">
          <div class="flex items-center justify-between mb-2">
            <h3 class="text-xs font-semibold text-slate-300">Contacts</h3>
            <span class="text-[10px] text-slate-500">PayID + receiver evidence</span>
          </div>
          <div id="payee-list" class="space-y-1.5 mb-3"></div>
          <form id="add-payee-form" class="space-y-1.5">
            <input id="payee-nickname" type="text" placeholder="Name, e.g. John Smith"
              class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-emerald-500" />
            <div class="flex items-center gap-2">
              <input id="payee-phone" type="tel" placeholder="Phone / PayID, e.g. 0412 345 678"
                class="flex-1 bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-emerald-500" />
              <button type="submit" class="text-xs font-medium px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 transition whitespace-nowrap">
                Add contact
              </button>
            </div>
          </form>
          <p id="payee-feedback" class="text-[11px] h-4 mt-1"></p>
          <button id="seed-contacts-btn" type="button"
            class="w-full text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 hover:bg-slate-800 transition mt-1">
            + Seed a variety of demo contacts
          </button>
          <p id="seed-contacts-feedback" class="text-[11px] h-4 mt-1"></p>
        </div>

        <div class="px-4 py-3">
          <h3 class="text-xs font-semibold text-slate-300 mb-2">Payment methods</h3>
          <div id="pm-list" class="space-y-1.5 mb-3"></div>
          <button id="seed-card-btn" type="button"
            class="w-full text-xs font-medium px-3 py-2 rounded-lg border border-slate-700 hover:bg-slate-800 transition">
            + Add Stripe test card (Visa)
          </button>
          <p id="pm-feedback" class="text-[11px] h-4 mt-1"></p>
        </div>
      </div>

      <!-- Audit tab -->
      <div id="panel-audit" class="hidden flex-1 flex-col min-h-0">
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-800">
          <div>
            <h2 class="text-sm font-semibold">Audit Log</h2>
            <p class="text-[11px] text-slate-500">tamper-evident hash chain</p>
          </div>
          <span id="chain-status" class="text-[11px] font-medium px-2 py-1 rounded-md bg-slate-800 text-slate-400">—</span>
        </div>
        <div id="audit-events" class="flex-1 overflow-y-auto px-4 py-3 space-y-2 text-xs"></div>
      </div>
    </aside>

  </div>

  <script src="app.js"></script>
</body>
</html>
